<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Malaysian Credit Card Optimiser</title>
  <meta name="description" content="Rank Malaysian credit cards by your own spending, income and travel habits.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23065f46'/%3E%3Crect x='18' y='30' width='64' height='42' rx='6' fill='none' stroke='white' stroke-width='7'/%3E%3Cpath d='M18 45h64' stroke='white' stroke-width='7'/%3E%3C/svg%3E">

  <!-- Set the theme class before first paint, so there's no light-mode flash
       for anyone whose saved preference (or OS setting) is dark. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("cc-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>

  <!-- Pre-built Tailwind CSS (only the utility classes this page actually uses)
       and the bundled React app — both built locally, so the page works fully
       offline with no CDN dependency. Source is in src/app.jsx; see README.md
       to rebuild after editing it. -->
  <link rel="stylesheet" href="dist/app.css">
  <style>
    html { color-scheme: light dark; }
    body { background-color: #fafaf9; margin: 0; }
    html.dark body { background-color: #09090b; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/app.js"></script>
</body>
</html>
